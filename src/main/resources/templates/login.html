<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Hệ Thống Điểm Danh HUIT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    :root {
      --primary-color: #7DABD0;
      --secondary-color: #CFE7EA;
      --accent-color: #FBC1AD;
    }

    body {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      overflow: hidden;
      width: 100%;
      max-width: 450px;
      border: none;
    }

    .login-header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .nav-pills .nav-link {
      color: #777;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.3s;
      border: 1px solid #eee !important;
    }

    .nav-pills .nav-link.active {
      background-color: var(--accent-color) !important;
      color: #444 !important;
      border-color: var(--accent-color) !important;
    }

    .form-control {
      border-radius: 10px;
      border: 2px solid #f0f0f0;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(125, 171, 208, 0.2);
    }

    .btn-login {
      background-color: var(--primary-color);
      color: white;
      font-weight: bold;
      border-radius: 10px;
      padding: 12px;
      border: none;
      transition: 0.3s;
    }

    .btn-login:hover {
      background-color: #5b8bb5;
      transform: translateY(-2px);
      color: white;
    }

    .btn-canbo {
      background-color: #5d8cad;
    }
  </style>
</head>
<body>

<div class="login-card shadow-lg">
  <div class="login-header">
    <h3 class="mb-0 fw-bold"><i class="bi bi-mortarboard-fill me-2"></i>KHOA CNTT</h3>
    <p class="mb-0 mt-1 opacity-75 small">Hệ thống Quản lý Sự kiện & Điểm danh</p>
  </div>

  <div class="card-body p-4 p-md-5">

    <div th:if="${loi}" class="alert border-0 text-center fw-bold shadow-sm"
         style="background-color: #fce4ec; color: #d81b60;" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${loi}"></span>
    </div>

    <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active me-1" id="tab-sinhvien" data-bs-toggle="pill" data-bs-target="#content-sinhvien" type="button" role="tab">
          Sinh Viên
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link ms-1" id="tab-canbo" data-bs-toggle="pill" data-bs-target="#content-canbo" type="button" role="tab">
          Cán Bộ / BTC
        </button>
      </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">

      <div class="tab-pane fade show active" id="content-sinhvien" role="tabpanel">
        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">MÃ SINH VIÊN</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control bg-light border-0" placeholder="VD: 2001210001" required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold text-secondary">MẬT KHẨU</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control bg-light border-0" placeholder="••••••••" required>
            </div>
          </div>
          <button type="submit" class="btn btn-login w-100 shadow-sm">
            ĐĂNG NHẬP SINH VIÊN
          </button>
        </form>
      </div>

      <div class="tab-pane fade" id="content-canbo" role="tabpanel">
        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">TÀI KHOẢN QUẢN TRỊ</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-shield-lock"></i></span>
              <input type="text" name="username" class="form-control bg-light border-0" placeholder="Mã cán bộ hoặc BTC" required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold text-secondary">MẬT KHẨU CẤP PHÁT</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-key"></i></span>
              <input type="password" name="password" class="form-control bg-light border-0" placeholder="••••••••" required>
            </div>
          </div>
          <button type="submit" class="btn btn-login btn-canbo w-100 shadow-sm">
            ĐĂNG NHẬP HỆ THỐNG
          </button>
        </form>
      </div>

    </div>

    <div class="text-center mt-4">
      <a href="#" class="text-decoration-none small text-muted">
        <i class="bi bi-question-circle me-1"></i>Quên mật khẩu? Liên hệ Giáo Vụ
      </a>
    </div>
  </div>
</div>

</body>
</html>
