<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::#main-content})}">
<head>
  <title>Đăng Ký Tham Gia</title>
</head>
<body>

<div id="main-content">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">

      <div class="card shadow-sm border-0" style="border-radius: 15px; background-color: white;">
        <div class="card-header py-3" style="background-color: #FBC1AD; border-radius: 15px 15px 0 0;">
          <h4 class="mb-0 text-center text-dark fw-bold">ĐĂNG KÝ THAM GIA HOẠT ĐỘNG</h4>
        </div>

        <div class="card-body p-4 p-md-5">
          <div class="alert shadow-sm text-center mb-4" style="background-color: #CFE7EA; border: none; color: #437a82;">
            Bạn đang đăng ký cho: <br>
            <strong class="fs-5" th:text="${tenHD}">Tên hoạt động</strong>
          </div>

          <form th:action="@{/xu-ly-tham-gia}" method="post">
            <input type="hidden" name="maHD" th:value="${maHD}">

            <div class="form-floating mb-4">
              <input type="text" class="form-control border-0 shadow-sm"
                     style="background-color: #f8f9fa;"
                     id="noiDung" name="noiDung" required placeholder="Tên tiết mục">
              <label for="noiDung">Nội dung trình diễn (Tên tiết mục, thể loại...)</label>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold" style="color: #7DABD0;">
                <i class="bi bi-people-fill"></i> Danh sách thành viên (Mã sinh viên):
              </label>
              <textarea class="form-control border-0 shadow-sm"
                        name="danhSachMaSV"
                        rows="3"
                        style="background-color: #f8f9fa; border-radius: 10px;"
                        placeholder="VD: 2001210002, 2001210003..."></textarea>
              <div class="form-text text-muted">
                <i class="bi bi-info-circle"></i> Nhập các mã SV cách nhau bằng dấu phẩy. Để trống nếu thi cá nhân.
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-5">
              <a th:href="@{/chi-tiet(maHD=${maHD})}" class="text-secondary text-decoration-none fw-bold">
                ⬅️ Hủy và quay lại
              </a>
              <button type="submit" class="btn btn-lg px-5 shadow-sm fw-bold"
                      style="background-color: #7DABD0; color: white; border-radius: 10px;">
                GỬI ĐƠN ĐĂNG KÝ
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center mt-4 text-muted">
        <small>Hệ thống sẽ tự động kiểm tra tính hợp lệ của Mã Sinh Viên trước khi phê duyệt.</small>
      </div>

    </div>
  </div>
</div>

<style>
  .form-control:focus {
    background-color: #fff !important;
    border-color: #7DABD0 !important;
    box-shadow: 0 0 0 0.25rem rgba(125, 171, 208, 0.2) !important;
  }
  .btn:hover {
    background-color: #5d8cad !important;
    transform: scale(1.02);
    transition: 0.3s;
  }
</style>

</body>
</html>
